name: Publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['BossMod/BossModReborn.json', '.github/workflows/publish.yml']
    tags:
      - '*.*.*.*'
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw 'BossMod/BossModReborn.json' | ConvertFrom-Json).AssemblyVersion
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid plugin version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $version) { throw 'Tag and plugin version differ.' }
          "tag=$version" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore Nuget Packages
        run: dotnet restore BossMod\BossModReborn.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release BossMod\BossModReborn.csproj -p:AssemblyVersion=${{ env.tag }} -p:FileVersion=${{ env.tag }} -p:PackageVersion=${{ env.tag }} -p:InformationalVersion=${{ env.tag }} --output .\build

      - name: Verify and package the plugin
        shell: pwsh
        run: |
          $name = 'BossModReborn'
          $dir = Join-Path $PWD 'build'
          $manifest = Get-Content -Raw (Join-Path $dir "$name.json") | ConvertFrom-Json
          $dll = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $dir "$name.dll"))
          if ($dll.Name -cne $name -or $manifest.InternalName -cne $name -or $dll.Version.ToString() -ne $env:tag -or $manifest.AssemblyVersion -ne $env:tag -or [int]$manifest.DalamudApiLevel -ne 15) {
            throw 'Packaged plugin identity, version or API does not match the manifest.'
          }
          $files = @("$dir/$name.dll", "$dir/$name.json", "$dir/DefaultRotationPresets.json", "$dir/RebornPresets.json")
          foreach ($optional in @("$name.pdb", "PInvoke.User32.dll")) {
            $item = Join-Path $dir $optional
            if (Test-Path -LiteralPath $item) { $files += $item }
          }
          $releaseDir = New-Item -ItemType Directory -Path 'release-package' -Force
          $zip = Join-Path $releaseDir.FullName 'latest.zip'
          Compress-Archive -LiteralPath $files -DestinationPath $zip
          Write-Host "Verified $name $env:tag for API 15. SHA256: $((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash)"

      - name: Publish Plugin
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-package/latest.zip
            BossMod/BossModReborn.json
          fail_on_unmatched_files: true
          overwrite_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
